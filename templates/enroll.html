<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enroll Student</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><header><h1>Enroll Student</h1><a href="/">Attendance</a></header><form id="enroll-form"><label>Enrollment No.<input required name="enrollment_id" placeholder="2026001"></label><label>Student name<input required name="name" placeholder="Student name"></label><label>Clear face photo<input required name="photo" type="file" accept="image/*"></label><button>Save student</button><p id="message"></p></form></main><script>document.querySelector('#enroll-form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/enroll',{method:'POST',body:new FormData(e.target)}),d=await r.json();document.querySelector('#message').textContent=d.message||d.error}</script></body></html>
