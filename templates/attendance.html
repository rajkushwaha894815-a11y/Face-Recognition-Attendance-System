<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #050505;
    --surface: #0d0d0d;
    --surface-2: #111111;
    --surface-3: #171717;
    --border: #252525;
    --text: #f5f5f5;
    --muted: #8d8d8d;
    --blue: #3b82f6;
    --blue2: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --purple: #a855f7;
}

body {
    margin: 0;
    font-family: Inter, Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 10% 0%, rgba(59,130,246,.12), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(168,85,247,.10), transparent 30%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* HEADER */

.header {
    background:
        linear-gradient(135deg, rgba(37,99,235,.95), rgba(88,28,135,.92));
    border-bottom: 1px solid rgba(255,255,255,.1);
    padding: 34px 35px;
    position: relative;
    overflow: hidden;
}

.header::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    right: -100px;
    top: -180px;
    background: rgba(255,255,255,.08);
    border-radius: 50%;
}

.header-content {
    max-width: 1400px;
    margin: auto;
    position: relative;
    z-index: 2;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.header p {
    margin: 0;
    color: rgba(255,255,255,.75);
    font-size: 14px;
}

/* CONTAINER */

.container {
    max-width: 1400px;
    margin: auto;
    padding: 32px;
}

/* SELECTED STUDENT */

.student-banner {
    display: none;
    background: linear-gradient(
        135deg,
        rgba(59,130,246,.12),
        rgba(168,85,247,.08)
    );
    border: 1px solid rgba(59,130,246,.3);
    border-left: 4px solid var(--blue);
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 24px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 45px rgba(0,0,0,.25);
}

.student-banner.active {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.student-banner h2 {
    margin: 0 0 6px;
    font-size: 21px;
}

.student-banner p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
}

.student-id {
    color: #60a5fa;
    font-weight: 700;
}

.back-students,
.back-btn {
    text-decoration: none;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 11px 17px;
    border-radius: 10px;
    font-weight: 700;
    transition: .25s;
    border: 1px solid rgba(255,255,255,.08);
}

.back-students:hover,
.back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(37,99,235,.3);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 24px;
}

.stat-card {
    background: linear-gradient(
        145deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.02)
    );
    border: 1px solid var(--border);
    padding: 23px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
    transition: .3s;
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    right: -40px;
    top: -40px;
    background: rgba(59,130,246,.08);
    border-radius: 50%;
}

.stat-card:hover {
    transform: translateY(-4px);
    border-color: #333;
}

.stat-title {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 30px;
    font-weight: 800;
}

.total {
    color: #60a5fa;
}

.present {
    color: var(--green);
}

.absent {
    color: var(--red);
}

.percentage {
    color: #c084fc;
}

/* MAIN CARD */

.card {
    background: rgba(13,13,13,.92);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 20px 55px rgba(0,0,0,.3);
    backdrop-filter: blur(14px);
}

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.title-section h2 {
    margin: 0 0 6px;
    font-size: 23px;
}

.title-section p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

/* FILTERS */

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    background: #090909;
    color: var(--text);
    transition: .25s;
}

input::placeholder {
    color: #666;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}

input[type="date"] {
    color-scheme: dark;
}

.refresh-btn {
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    cursor: pointer;
    font-weight: 700;
    transition: .25s;
}

.refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(37,99,235,.35);
}

/* TABLE */

.table-container {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #090909;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th {
    background: #111111;
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
}

th,
td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #202020;
}

td {
    color: #d4d4d4;
    font-size: 14px;
}

tbody tr {
    transition: .2s;
}

tbody tr:hover {
    background: rgba(59,130,246,.045);
}

tbody tr:last-child td {
    border-bottom: none;
}

.enrollment {
    font-weight: 700;
    color: #60a5fa;
}

.student-name {
    font-weight: 600;
    color: #f1f1f1;
}

.time {
    color: #aaa;
}

/* STATUS */

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 800;
    border: 1px solid;
}

.status.present {
    background: rgba(34,197,94,.1);
    color: #4ade80;
    border-color: rgba(34,197,94,.25);
}

.status.absent {
    background: rgba(239,68,68,.1);
    color: #f87171;
    border-color: rgba(239,68,68,.25);
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
}

/* EMPTY / LOADING */

.empty,
.loading {
    text-align: center;
    padding: 50px;
    color: #777;
}

/* BOTTOM */

.bottom-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
    flex-wrap: wrap;
}

.record-count {
    color: #777;
    font-size: 13px;
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #080808;
}

::-webkit-scrollbar-thumb {
    background: #292929;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #3b3b3b;
}

/* RESPONSIVE */

@media (max-width: 1000px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 700px) {

    .header {
        padding: 25px 18px;
    }

    .header h1 {
        font-size: 25px;
    }

    .container {
        padding: 16px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
        border-radius: 16px;
    }

    .filters {
        width: 100%;
    }

    .filters input,
    .refresh-btn {
        width: 100%;
    }

    .student-banner.active {
        align-items: flex-start;
    }
}
</style>
